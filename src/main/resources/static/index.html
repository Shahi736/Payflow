<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payflow - Sign In & Register</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 24px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #007bff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
            cursor: pointer;
        }
        .toggle-link span {
            color: #007bff;
            font-weight: bold;
        }
        .hidden {
            display: none;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- SIGN IN FORM -->
    <div id="login-section">
        <h2>Sign In</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="login-username">Username or Email</label>
                <input type="text" id="login-username" autocomplete="off" required />
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" autocomplete="new-password" required />
            </div>
            <button type="submit">Sign In</button>
        </form>
        <div class="toggle-link" onclick="toggleForms()">
            Don't have an account? <span>Create Account</span>
        </div>
    </div>

    <!-- CREATE ACCOUNT FORM -->
    <div id="register-section" class="hidden">
        <h2>Create Account</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="reg-username">Username</label>
                <input type="text" id="reg-username" autocomplete="off" required />
            </div>
            <div class="form-group">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" autocomplete="off" required />
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" autocomplete="new-password" required />
            </div>
            <button type="submit">Register</button>
        </form>
        <div class="toggle-link" onclick="toggleForms()">
            Already have an account? <span>Sign In</span>
        </div>
    </div>

    <div id="message"></div>
</div>

<script>
    // ⚠️ REPLACE THIS WITH YOUR ACTUAL LIVE RENDER BACKEND URL
    const API_BASE_URL = "https://payflow-xxxx.onrender.com";

    function toggleForms() {
        const loginSection = document.getElementById('login-section');
        const registerSection = document.getElementById('register-section');
        loginSection.classList.toggle('hidden');
        registerSection.classList.toggle('hidden');
        document.getElementById('message').innerText = '';
    }

    // Handle Sign In
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;
        const msg = document.getElementById('message');

        msg.style.color = '#333';
        msg.innerText = 'Connecting to server...';

        try {
            const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                msg.style.color = 'green';
                msg.innerText = 'Login successful!';
            } else {
                msg.style.color = 'red';
                msg.innerText = 'Invalid username or password.';
            }
        } catch (error) {
            msg.style.color = 'red';
            msg.innerText = 'Failed to fetch. Wake up Render or check URL.';
            console.error(error);
        }
    });

    // Handle Registration
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('reg-username').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const msg = document.getElementById('message');

        msg.style.color = '#333';
        msg.innerText = 'Creating account...';

        try {
            const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });

            if (response.ok) {
                msg.style.color = 'green';
                msg.innerText = 'Account created successfully! Please sign in.';
                setTimeout(toggleForms, 2000);
            } else {
                msg.style.color = 'red';
                msg.innerText = 'Registration failed.';
            }
        } catch (error) {
            msg.style.color = 'red';
            msg.innerText = 'Failed to fetch. Wake up Render or check URL.';
            console.error(error);
        }
    });
</script>
</body>
</html>
